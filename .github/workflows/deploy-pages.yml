# ─────────────────────────────────────────────────────────────────────────────
# AegisFlow IDS — GitHub Pages Deployment
# ─────────────────────────────────────────────────────────────────────────────
# Triggers: push to main branch (any change to frontend/ or this workflow file)
# Also available as a manual trigger from the Actions tab.
#
# Deploys the Next.js static export to the gh-pages branch, which GitHub Pages
# serves at:
#   https://rohitsingh83.github.io/Network-Intrusion-Detection-System-Simulation/
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy AegisFlow SOC Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:   # Allow manual trigger from Actions tab

# GitHub Pages requires these permissions
permissions:
  contents: write      # To push to gh-pages branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ── 4. Build Next.js static export ──────────────────────────────────────
      - name: Build for GitHub Pages
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_STANDALONE: 'true'
          # Disable Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      # ── 5. Add .nojekyll so GitHub Pages doesn't skip _next/ folder ──────────
      - name: Add .nojekyll
        run: touch frontend/out/.nojekyll

      # ── 6. Deploy to gh-pages branch ─────────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: |
            🚀 Deploy AegisFlow SOC Dashboard
            
            Triggered by: ${{ github.event_name }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
